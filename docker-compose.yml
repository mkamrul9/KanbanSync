version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: kanbansync
      POSTGRES_USER: kanbansync
      POSTGRES_PASSWORD: kanbansync_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanbansync']
      interval: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports: 
      - '3000:3000'
    depends_on: 
      db: 
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanbansync:kanbansync_dev@db:5432/kanbansync
      AUTH_SECRET: dev-secret-must-be-at-least-32-characters-long
    # env_file: .env.local
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
